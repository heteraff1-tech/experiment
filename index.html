<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Harness — визуальный редактор процессов</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" data-icon="brand"></span><strong>Harness</strong></div>
      <div class="breadcrumb">
        <span class="workspace-name">Продуктовая студия</span><span class="crumb-arrow" data-icon="chevron-right"></span><strong>От идеи к прототипу</strong>
      </div>
      <div class="top-actions">
        <span class="draft"><i></i> Демо</span>
        <button id="more" class="button icon-button" aria-label="Действия со сценарием" aria-expanded="false" data-icon="more"></button>
        <div id="more-menu" class="popover" hidden><button id="reset" class="button"><span data-icon="reset"></span>Сбросить демо</button></div>
      </div>
    </header>

    <div class="workspace">
      <aside class="rail" aria-label="Панель инструментов">
        <button class="rail-button active" id="editor-shortcut" title="Холст" aria-label="Вернуться на холст" data-icon="workflow"></button>
        <button class="rail-button" id="library-shortcut" title="Библиотека блоков" aria-label="Библиотека блоков" aria-controls="library" aria-expanded="false" data-icon="layers"></button>
      </aside>

      <main class="editor" aria-label="Редактор сценария">
        <nav class="view-tabs" aria-label="Виды сценария">
          <div class="view-switch">
            <button class="tab active" data-view="canvas">Редактор</button>
            <button class="tab" data-view="runs">Запуски</button>
            <button class="tab" data-view="prototype">Прототип</button>
          </div>
        </nav>

        <section id="canvas-view" class="canvas-view">
          <div id="canvas" class="canvas" aria-label="Холст со связанными блоками">
            <div id="world" class="world">
              <article class="workflow-note">
                <h1>Внутреннее демо</h1>
                <p>Проверяем, как пациент может повторно записаться к своему врачу в мобильном приложении.</p>
              </article>
              <div class="source-zone"><span data-icon="plug"></span> Источники контекста</div>
              <svg class="wires" aria-hidden="true" width="1" height="1"><defs>
                <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
              </defs><g id="wires"></g></svg>
              <div id="nodes"></div>
            </div>

            <div class="canvas-actions">
              <button id="library-toggle" class="button icon-button" title="Добавить блок (/)" aria-label="Добавить блок" aria-controls="library" aria-expanded="false" data-icon="plus"></button>
            </div>

            <div class="canvas-tools">
              <div class="tools-group">
                <button id="select-tool" class="tool active" title="Выбор (V)" aria-label="Выбор" aria-pressed="true" data-icon="cursor"></button>
                <button id="pan-tool" class="tool" title="Рука (H)" aria-label="Перемещение холста" aria-pressed="false" data-icon="hand"></button>
              </div>
              <div class="tools-group zoom-tools">
                <button id="fit" class="tool" title="Вместить всё (0)" aria-label="Вместить всё" data-icon="fit"></button>
                <button id="zoom-out" class="tool" title="Уменьшить" aria-label="Уменьшить" data-icon="minus"></button>
                <span id="scale" class="scale">100%</span>
                <button id="zoom-in" class="tool" title="Увеличить" aria-label="Увеличить" data-icon="plus"></button>
              </div>
            </div>
            <div class="run-controls">
              <button id="run" class="button primary"><span data-icon="play"></span><span id="run-label">Запустить демо</span></button>
            </div>
            <button id="minimap" class="minimap" title="Вернуться ко всему сценарию" aria-label="Вместить весь сценарий"></button>
          </div>
        </section>

        <section id="runs-view" class="secondary-view" hidden></section>
        <section id="prototype-view" class="secondary-view prototype-view" hidden></section>
        <footer class="statusbar"><span id="counts"></span><span class="status-tip"><kbd>Space</kbd> + перетаскивание</span><span class="status-right"><i></i> <span id="status-text">Готов к запуску</span></span></footer>
      </main>

      <aside id="library" class="library drawer" aria-label="Библиотека блоков" hidden>
        <div class="library-top">
          <div class="drawer-heading"><h2>Добавить блок</h2><button id="close-library" class="button icon-button quiet" aria-label="Закрыть библиотеку" data-icon="x"></button></div>
          <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Найти блок…" aria-label="Найти блок"><kbd>/</kbd></label>
        </div>
        <div id="library-list" class="library-list"></div>
      </aside>
      <aside id="inspector" class="inspector drawer" aria-label="Настройки блока" hidden></aside>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
